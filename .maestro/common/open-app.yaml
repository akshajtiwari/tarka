# Fresh app with the setup done the quick way: projects inside TARKA, Python installed,
# git and AI left for later. Every flow starts here.
appId: com.akshajtiwari.tarka
---
- runFlow: start-app.yaml
- tapOn: Start setup
- tapOn: Continue # theme
- tapOn: Inside TARKA
- tapOn: Continue
- extendedWaitUntil: # Python is required: it downloads once (about 10 MB)
    visible: Python is ready
    timeout: 180000
- tapOn: Continue
- tapOn: Set up later # git
- tapOn: Set up later # AI
- tapOn: Set up later # Termux
- tapOn: Continue # tips
- tapOn: Start coding
- extendedWaitUntil:
    visible: Projects
    timeout: 10000
