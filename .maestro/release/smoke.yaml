# Release build check, no Metro: setup (projects in Documents/TARKA, Python installed), the terminal
# runs JavaScript with input() and Python, code you run can't read app files, and the project's
# folder is shown. Not part of `npm run e2e`. Install the release APK, then:
#   maestro test .maestro/release/smoke.yaml
appId: com.akshajtiwari.tarka
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Start setup
    timeout: 30000
- tapOn: Start setup
- tapOn: Continue # theme
# Documents/TARKA is preselected. Allow file access unless Android still has it allowed.
- runFlow:
    when:
      visible: Allow file access
    commands:
      - tapOn: Allow file access
      - extendedWaitUntil:
          visible: .*(all files|All files).*
          timeout: 10000
      - tapOn: .*(Allow access to manage all files|Allow access).*
      - back
- extendedWaitUntil:
    visible: /storage/emulated/0/Documents/TARKA
    timeout: 10000
- tapOn: Continue
- extendedWaitUntil: # downloads Pyodide from the CDN once
    visible: Python is ready
    timeout: 180000
- takeScreenshot: release-setup-python
- tapOn: Continue
- tapOn: Set up later # git
- tapOn: Set up later # AI
- tapOn: Set up later # Termux
- tapOn: Continue # tips
- tapOn: Start coding
- extendedWaitUntil:
    visible: Projects
    timeout: 10000
# JavaScript in the terminal.
- tapOn: New project
- tapOn: Name
- inputText: js
- tapOn: JavaScript
- hideKeyboard
- tapOn: Create project
- tapOn: Run
- tapOn: Terminal input
- inputText: run main.js
- pressKey: Enter
- extendedWaitUntil:
    visible: hello, world
    timeout: 20000
- takeScreenshot: release-terminal-js
# input(), and the file:// check: release pages load from file://, and the WebView allows
# file reads, so the worker must refuse them.
- tapOn: # tapping the output closes the keyboard
    point: 50%,40%
- tapOn: Code
- tapOn:
    text: Show files
    index: 0
- tapOn: New file or folder
- tapOn: New file
- inputText: probe.js
- hideKeyboard
- tapOn: Done
- tapOn: File probe.js
- tapOn:
    point: 50%,30%
- inputText: const n = await input("Name? ")
- pressKey: Enter
- inputText: "fetch('file:///proc/self/status').then(() => console.log('READ ' + n), (e) => console.log('BLOCKED ' + n + ' ' + e.message))"
- hideKeyboard
- tapOn: Run file
- extendedWaitUntil:
    visible: Name\?.*
    timeout: 20000
- tapOn: Terminal input
- inputText: Ada
- pressKey: Enter
- extendedWaitUntil:
    visible: BLOCKED Ada Only web addresses.*
    timeout: 15000
- takeScreenshot: release-file-blocked
# import() can't be guarded from JavaScript: the runner page's security policy must refuse it.
- tapOn: Code
- tapOn:
    text: Show files
    index: 0
- tapOn: New file or folder
- tapOn: New file
- inputText: imp.js
- hideKeyboard
- tapOn: Done
- tapOn: File imp.js
- tapOn:
    point: 50%,30%
- inputText: "self.addEventListener('securitypolicyviolation', (e) => console.log('VIOLATION ' + e.blockedURI))"
- pressKey: Enter
- inputText: "await import('file:///storage/emulated/0/Documents/TARKA/js/main.js').then(() => console.log('IMPORTED'), () => console.log('IMPORT FAILED')); await new Promise((r) => setTimeout(r, 500))"
- hideKeyboard
- tapOn: Run file
- extendedWaitUntil:
    visible: VIOLATION file
    timeout: 15000
- assertNotVisible: IMPORTED
- takeScreenshot: release-import-blocked
# Python in the terminal (Pyodide was cached during setup).
- tapOn: Go to projects
- tapOn: New project
- tapOn: Name
- inputText: py
- tapOn: Python
- hideKeyboard
- tapOn: Create project
- tapOn: Run
- tapOn: Terminal input
- inputText: run main.py
- pressKey: Enter
- extendedWaitUntil:
    visible: hello, world
    timeout: 120000
- takeScreenshot: release-terminal-python
# The project lives in Documents/TARKA, and its folder is shown.
- tapOn: Go to projects
- longPressOn: py
- assertVisible: /storage/emulated/0/Documents/TARKA/py.*
- takeScreenshot: release-project-folder
