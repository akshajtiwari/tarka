# First launch opens the setup, and it can't be skipped past Python.
appId: com.akshajtiwari.tarka
---
- runFlow: common/start-app.yaml
- takeScreenshot: welcome
- tapOn: Start setup
- tapOn: Continue
- tapOn: Inside TARKA
- tapOn: Continue
- assertVisible: Installing Python
- takeScreenshot: setup-python
- extendedWaitUntil:
    visible: Python is ready
    timeout: 180000
- tapOn: Continue
- assertVisible: Your name for git
